<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テトリス</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1020;
      --panel: #161b2e;
      --line: rgba(255, 255, 255, 0.06);
      --text: #e7ecf8;
      --muted: #93a0c0;
      --accent: #7aa2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 600px at 50% -10%, #243056 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    .game {
      display: flex;
      gap: 20px;
      align-items: stretch;
      padding: 24px;
    }

    .board-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      background: #101628;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
      background: rgba(8, 10, 20, 0.88);
      text-align: center;
      padding: 24px;
    }

    .overlay[hidden] { display: none; }

    .overlay h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.08em;
    }

    .overlay p {
      margin: 0;
      color: var(--text);
      font-size: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 22px;
      font: inherit;
      font-weight: 700;
      color: #0c1020;
      background: var(--accent);
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    aside {
      width: 200px;
      background: var(--panel);
      border-radius: 12px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.18em;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { font-size: 18px; }

    .next-label {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    #next {
      background: #101628;
      border-radius: 8px;
    }

    .help {
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    kbd {
      display: inline-block;
      min-width: 1.2em;
      padding: 0 4px;
      border-radius: 4px;
      background: #2a314b;
      color: var(--text);
      font-family: inherit;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="board-wrap">
      <canvas id="board" width="300" height="600" aria-label="テトリスの盤面"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">テトリス</h2>
        <p id="overlay-text">キーを押すか、ボタンで開始します。</p>
        <button type="button" id="start-btn">スタート</button>
      </div>
    </div>
    <aside>
      <h1>TETRIS</h1>
      <div class="stat"><span>スコア</span><strong id="score">0</strong></div>
      <div class="stat"><span>ライン</span><strong id="lines">0</strong></div>
      <div class="stat"><span>レベル</span><strong id="level">1</strong></div>
      <p class="next-label">次のブロック</p>
      <canvas id="next" width="120" height="120" aria-label="次のブロック"></canvas>
      <ul class="help">
        <li><kbd>←</kbd><kbd>→</kbd> 移動</li>
        <li><kbd>↑</kbd> 回転　<kbd>Z</kbd> 逆回転</li>
        <li><kbd>↓</kbd> ソフトドロップ</li>
        <li><kbd>Space</kbd> ハードドロップ</li>
        <li><kbd>P</kbd> 一時停止</li>
      </ul>
    </aside>
  </main>
  <script>
    const COLS = 10;
    const ROWS = 20;
    const CELL = 30;
    const LOCK_MS = 500;
    const MAX_LOCK_RESETS = 15;
    const DAS_MS = 160;
    const ARR_MS = 40;

    const COLORS = {
      I: "#3fd6e0",
      O: "#f2d04b",
      T: "#b06bff",
      S: "#5dce6a",
      Z: "#f25f5c",
      J: "#4c7dff",
      L: "#f29a3a",
    };

    const SHAPES = {
      I: [
        [[0, 1], [1, 1], [2, 1], [3, 1]],
        [[2, 0], [2, 1], [2, 2], [2, 3]],
        [[0, 2], [1, 2], [2, 2], [3, 2]],
        [[1, 0], [1, 1], [1, 2], [1, 3]],
      ],
      O: [
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [2, 1]],
      ],
      T: [
        [[1, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [1, 1], [2, 1], [1, 2]],
        [[0, 1], [1, 1], [2, 1], [1, 2]],
        [[1, 0], [0, 1], [1, 1], [1, 2]],
      ],
      S: [
        [[1, 0], [2, 0], [0, 1], [1, 1]],
        [[1, 0], [1, 1], [2, 1], [2, 2]],
        [[1, 1], [2, 1], [0, 2], [1, 2]],
        [[0, 0], [0, 1], [1, 1], [1, 2]],
      ],
      Z: [
        [[0, 0], [1, 0], [1, 1], [2, 1]],
        [[2, 0], [1, 1], [2, 1], [1, 2]],
        [[0, 1], [1, 1], [1, 2], [2, 2]],
        [[1, 0], [0, 1], [1, 1], [0, 2]],
      ],
      J: [
        [[0, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [2, 0], [1, 1], [1, 2]],
        [[0, 1], [1, 1], [2, 1], [2, 2]],
        [[1, 0], [1, 1], [0, 2], [1, 2]],
      ],
      L: [
        [[2, 0], [0, 1], [1, 1], [2, 1]],
        [[1, 0], [1, 1], [1, 2], [2, 2]],
        [[0, 1], [1, 1], [2, 1], [0, 2]],
        [[0, 0], [1, 0], [1, 1], [1, 2]],
      ],
    };

    const KICKS = {
      JLSTZ: {
        "0>1": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
        "1>2": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
        "2>3": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
        "3>0": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
        "0>3": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
        "3>2": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
        "2>1": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
        "1>0": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
      },
      I: {
        "0>1": [[0, 0], [-2, 0], [1, 0], [-2, 1], [1, -2]],
        "1>2": [[0, 0], [-1, 0], [2, 0], [-1, -2], [2, 1]],
        "2>3": [[0, 0], [2, 0], [-1, 0], [2, -1], [-1, 2]],
        "3>0": [[0, 0], [1, 0], [-2, 0], [1, 2], [-2, -1]],
        "0>3": [[0, 0], [-1, 0], [2, 0], [-1, 1], [2, -2]],
        "3>2": [[0, 0], [1, 0], [-2, 0], [1, -1], [-2, 2]],
        "2>1": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
        "1>0": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
      },
    };

    const LINE_SCORE = [0, 100, 300, 500, 800];

    function bag() {
      const pieces = ["I", "O", "T", "S", "Z", "J", "L"];
      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }
      return pieces;
    }

    function emptyBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    class Tetris {
      constructor() {
        this.boardCanvas = document.getElementById("board");
        this.nextCanvas = document.getElementById("next");
        this.ctx = this.boardCanvas.getContext("2d");
        this.nextCtx = this.nextCanvas.getContext("2d");
        this.scoreEl = document.getElementById("score");
        this.linesEl = document.getElementById("lines");
        this.levelEl = document.getElementById("level");
        this.overlay = document.getElementById("overlay");
        this.overlayTitle = document.getElementById("overlay-title");
        this.overlayText = document.getElementById("overlay-text");
        this.startBtn = document.getElementById("start-btn");
        this.status = "ready";
        this.reset();
        this.keys = new Set();
        this.horiz = null;
        this.das = 0;
        this.arr = 0;
        this.soft = 0;
        this.last = 0;
        window.addEventListener("click", (event) => {
          if (event.target.closest("#start-btn")) this.onActionClick();
        }, true);
        window.addEventListener("keydown", (event) => this.onKeyDown(event));
        window.addEventListener("keyup", (event) => this.onKeyUp(event));
        requestAnimationFrame((t) => this.frame(t));
        this.draw();
      }

      reset() {
        this.board = emptyBoard();
        this.queue = [...bag(), ...bag()];
        this.score = 0;
        this.lines = 0;
        this.level = 1;
        this.current = null;
        this.gravity = 0;
        this.lockTimer = 0;
        this.lockResets = 0;
      }

      onActionClick() {
        if (this.status === "paused") {
          this.resume();
          return;
        }
        this.start();
      }

      start() {
        this.reset();
        this.status = "playing";
        this.spawn();
        this.hideOverlay();
        this.syncHud();
      }

      resume() {
        this.status = "playing";
        this.hideOverlay();
      }

      showOverlay(title, text, buttonLabel) {
        this.overlayTitle.textContent = title;
        this.overlayText.textContent = text;
        this.startBtn.textContent = buttonLabel;
        this.overlay.hidden = false;
      }

      hideOverlay() {
        this.overlay.hidden = true;
      }

      spawn() {
        const type = this.queue.shift();
        if (this.queue.length < 7) this.queue.push(...bag());
        this.current = { type, rot: 0, x: 3, y: 0 };
        this.gravity = 0;
        this.lockTimer = 0;
        this.lockResets = 0;
        if (this.collides(3, 0, 0)) this.gameOver();
      }

      gameOver() {
        this.status = "over";
        this.current = null;
        this.syncHud();
        this.showOverlay("ゲームオーバー", `スコア ${this.score.toLocaleString("ja-JP")}`, "もう一度");
      }

      cells(piece = this.current, rot = piece?.rot, x = piece?.x, y = piece?.y) {
        if (!piece) return [];
        return SHAPES[piece.type][rot].map(([cx, cy]) => [x + cx, y + cy]);
      }

      collides(x, y, rot, type = this.current?.type) {
        if (!type) return true;
        for (const [cx, cy] of SHAPES[type][rot]) {
          const bx = x + cx;
          const by = y + cy;
          if (bx < 0 || bx >= COLS || by >= ROWS) return true;
          if (by >= 0 && this.board[by][bx]) return true;
        }
        return false;
      }

      grounded() {
        return this.current && this.collides(this.current.x, this.current.y + 1, this.current.rot);
      }

      tryMove(dx, dy, fromPlayer = true) {
        if (this.status !== "playing" || !this.current) return false;
        const { x, y, rot } = this.current;
        if (this.collides(x + dx, y + dy, rot)) return false;
        this.current.x += dx;
        this.current.y += dy;
        if (fromPlayer) this.bumpLock();
        return true;
      }

      tryRotate(dir) {
        if (this.status !== "playing" || !this.current) return false;
        const { type, rot, x, y } = this.current;
        const next = (rot + dir + 4) % 4;
        const table = type === "I" ? KICKS.I : type === "O" ? { [`${rot}>${next}`]: [[0, 0]] } : KICKS.JLSTZ;
        const kicks = table[`${rot}>${next}`] || [[0, 0]];
        for (const [kx, ky] of kicks) {
          if (!this.collides(x + kx, y + ky, next)) {
            this.current.x = x + kx;
            this.current.y = y + ky;
            this.current.rot = next;
            this.bumpLock();
            return true;
          }
        }
        return false;
      }

      bumpLock() {
        if (!this.grounded()) return;
        if (this.lockResets < MAX_LOCK_RESETS) {
          this.lockTimer = 0;
          this.lockResets++;
        }
      }

      dropInterval() {
        return Math.max(80, 800 * Math.pow(0.82, this.level - 1));
      }

      hardDrop() {
        if (this.status !== "playing" || !this.current) return;
        let dist = 0;
        while (this.tryMove(0, 1)) dist++;
        this.score += dist * 2;
        this.lock();
      }

      lock() {
        if (!this.current) return;
        for (const [x, y] of this.cells()) {
          if (y < 0) {
            this.gameOver();
            return;
          }
          this.board[y][x] = this.current.type;
        }
        const cleared = this.clearLines();
        if (cleared) {
          this.score += LINE_SCORE[cleared] * this.level;
          this.lines += cleared;
          this.level = 1 + Math.floor(this.lines / 10);
        }
        this.syncHud();
        if (this.status === "playing") this.spawn();
      }

      clearLines() {
        let cleared = 0;
        for (let y = ROWS - 1; y >= 0; y--) {
          if (this.board[y].every(Boolean)) {
            this.board.splice(y, 1);
            this.board.unshift(Array(COLS).fill(null));
            cleared++;
            y++;
          }
        }
        return cleared;
      }

      ghostY() {
        let y = this.current.y;
        while (!this.collides(this.current.x, y + 1, this.current.rot)) y++;
        return y;
      }

      onKeyDown(event) {
        const code = event.code;
        const handled = ["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", "Space", "KeyZ", "KeyX", "KeyP", "Enter"].includes(code);
        if (handled) event.preventDefault();

        if (code === "Enter" && (this.status === "ready" || this.status === "over")) {
          this.start();
          return;
        }
        if (code === "KeyP" && !event.repeat && (this.status === "playing" || this.status === "paused")) {
          this.togglePause();
          return;
        }
        if (this.status !== "playing") return;

        if (code === "ArrowLeft" || code === "ArrowRight") {
          const dir = code === "ArrowLeft" ? "left" : "right";
          if (!event.repeat) {
            this.horiz = dir;
            this.das = DAS_MS;
            this.arr = ARR_MS;
            this.tryMove(dir === "left" ? -1 : 1, 0);
          }
        } else if (code === "ArrowDown" && !this.keys.has(code)) {
          this.soft = 0;
          if (this.tryMove(0, 1)) this.score += 1;
        } else if (code === "ArrowUp" && !event.repeat) {
          this.tryRotate(1);
        } else if ((code === "KeyZ" || code === "KeyX") && !event.repeat) {
          this.tryRotate(code === "KeyZ" ? -1 : 1);
        } else if (code === "Space" && !event.repeat) {
          this.hardDrop();
        }
        if (handled) this.keys.add(code);
        this.syncHud();
      }

      onKeyUp(event) {
        this.keys.delete(event.code);
        if ((event.code === "ArrowLeft" && this.horiz === "left") || (event.code === "ArrowRight" && this.horiz === "right")) {
          this.horiz = null;
        }
      }

      togglePause() {
        if (this.status === "playing") {
          this.status = "paused";
          this.showOverlay("一時停止", "P かボタンで再開します。", "再開");
        } else if (this.status === "paused") {
          this.resume();
        }
      }

      frame(time) {
        const dt = this.last ? Math.min(50, time - this.last) : 0;
        this.last = time;
        if (this.status === "playing" && this.current) this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.frame(t));
      }

      update(dt) {
        if (this.horiz) {
          this.das -= dt;
          if (this.das <= 0) {
            this.arr -= dt;
            while (this.arr <= 0) {
              this.tryMove(this.horiz === "left" ? -1 : 1, 0);
              this.arr += ARR_MS;
            }
          }
        }
        if (this.keys.has("ArrowDown")) {
          this.soft += dt;
          while (this.soft >= 45) {
            this.soft -= 45;
            if (this.tryMove(0, 1)) this.score += 1;
          }
        }

        if (this.grounded()) {
          this.lockTimer += dt;
          if (this.lockTimer >= LOCK_MS) this.lock();
        } else {
          this.lockTimer = 0;
          this.gravity += dt;
          const interval = this.dropInterval();
          while (this.gravity >= interval && this.current && this.status === "playing") {
            this.gravity -= interval;
            if (!this.tryMove(0, 1, false)) break;
          }
        }
        this.syncHud();
      }

      syncHud() {
        this.scoreEl.textContent = this.score.toLocaleString("ja-JP");
        this.linesEl.textContent = String(this.lines);
        this.levelEl.textContent = String(this.level);
      }

      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.boardCanvas.width, this.boardCanvas.height);
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            this.paintCell(ctx, x, y, this.board[y][x] ? COLORS[this.board[y][x]] : null);
          }
        }
        if (this.current && this.status !== "over") {
          const gy = this.ghostY();
          if (gy !== this.current.y) {
            for (const [x, y] of this.cells(this.current, this.current.rot, this.current.x, gy)) {
              if (y >= 0) this.strokeCell(ctx, x, y, COLORS[this.current.type]);
            }
          }
          for (const [x, y] of this.cells()) {
            if (y >= 0) this.paintCell(ctx, x, y, COLORS[this.current.type]);
          }
        }
        this.drawNext();
      }

      paintCell(ctx, x, y, color) {
        const px = x * CELL;
        const py = y * CELL;
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#0d1324";
        ctx.fillRect(px, py, CELL, CELL);
        ctx.strokeStyle = "rgba(255,255,255,0.04)";
        ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
        if (!color) return;
        ctx.fillStyle = color;
        ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.fillRect(px + 2, py + 2, CELL - 4, 4);
      }

      strokeCell(ctx, x, y, color) {
        const px = x * CELL;
        const py = y * CELL;
        ctx.globalAlpha = 1;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 4, py + 4, CELL - 8, CELL - 8);
      }

      drawNext() {
        const ctx = this.nextCtx;
        ctx.clearRect(0, 0, 120, 120);
        const type = this.queue[0];
        if (!type) return;
        const cells = SHAPES[type][0];
        const minX = Math.min(...cells.map(([x]) => x));
        const maxX = Math.max(...cells.map(([x]) => x));
        const minY = Math.min(...cells.map(([, y]) => y));
        const maxY = Math.max(...cells.map(([, y]) => y));
        const size = 24;
        const ox = (120 - (maxX - minX + 1) * size) / 2;
        const oy = (120 - (maxY - minY + 1) * size) / 2;
        for (const [x, y] of cells) {
          const px = ox + (x - minX) * size;
          const py = oy + (y - minY) * size;
          ctx.fillStyle = COLORS[type];
          ctx.fillRect(px + 1, py + 1, size - 2, size - 2);
        }
      }
    }

    const game = new Tetris();
  </script>
</body>
</html>
